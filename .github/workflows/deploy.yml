name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t weather-app:test .

      - name: Check app files are inside the image
        run: docker run --rm weather-app:test ls /usr/share/nginx/html

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t $IMAGE:latest .
          docker push $IMAGE:latest

      - name: Check if EC2 is configured
        id: ec2
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "EC2_HOST secret not set, skipping deploy."
          fi

      - name: Deploy to EC2
        if: steps.ec2.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:latest
            docker stop weather-app || true
            docker rm weather-app || true
            docker run -d --name weather-app --restart unless-stopped -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:latest
